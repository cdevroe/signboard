name: Maintenance regressions

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Optional source ref for a Linux baseline comparison'
        type: string
      test_filter:
        description: 'Optional Playwright title filter for the Linux run'
        type: string

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:js
      - name: Storage and CLI regressions
        run: |
          npm run test:maintenance
          npm run test:cli
          npm run test:mcp
          npm run test:automation-parity
          npm run test:desktop-cli
          npm run test:card-ordering
          npm run test:list-actions
          npm run test:editor-paths
          npm run test:board-refresh
          npm run test:board-card-metadata
      - name: Prepare isolated Electron desktop
        run: |
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --yes --no-install-recommends xvfb openbox libnss3 libasound2t64 libgbm1
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Electron regressions
        env:
          SIGNBOARD_PLAYWRIGHT_VIRTUAL_DESKTOP: '1'
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          # Match the lab desktop: window-manager mouse bindings must not grab
          # the pointer during a renderer drag.
          cat > "$RUNNER_TEMP/signboard-openbox.xml" <<'EOF'
          <openbox_config xmlns="http://openbox.org/3.4/rc"><focus><focusNew>yes</focusNew><followMouse>no</followMouse></focus><desktops><number>1</number></desktops><keyboard/><mouse/></openbox_config>
          EOF
          xvfb-run --auto-servernum --server-args='-screen 0 1440x1000x24 -nolisten tcp' dbus-run-session -- bash -e -c '
            openbox --sm-disable --config-file "$RUNNER_TEMP/signboard-openbox.xml" &
            wm_pid=$!
            trap "kill $wm_pid || true" EXIT
            for attempt in {1..100}; do
              if xprop -root _NET_SUPPORTING_WM_CHECK | grep -Eq "window id # 0x[1-9a-f]"; then break; fi
              sleep 0.1
            done
            if [[ -n "$TEST_FILTER" ]]; then
              npx playwright test --grep "$TEST_FILTER"
            else
              npx playwright test
            fi
          '

  windows:
    if: ${{ !inputs.source_ref }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash ./buildjs.sh
      - name: Protocol argument classification and CLI
        run: npm run test:cli
      - name: List rename rollback regressions
        run: npm run test:list-actions
      - name: Editor path regressions
        run: npm run test:editor-paths
      - name: Board refresh regressions
        run: npm run test:board-refresh
      - name: Full native Windows Electron regressions
        env:
          # Explicit opt-in applies only to this disposable hosted Windows desktop.
          SIGNBOARD_PLAYWRIGHT_ALLOW_LOCAL: '1'
        run: npx playwright test
      - name: Windows storage, automation and integration regressions
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          failed=0
          for suite in maintenance mcp automation-parity desktop-cli card-ordering board-snapshot board-duplication archive obsidian-integration import-trello import-obsidian import-tasksmd app-settings update-release-notes update-errors packaging-config; do
            npm run "test:$suite" || failed=1
          done
          exit "$failed"
