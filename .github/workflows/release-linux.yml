name: Build Linux release artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - "release/**"

permissions:
  contents: read

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            metadata: latest-linux.yml
            unpacked: linux-unpacked
          - runner: ubuntu-24.04-arm
            arch: arm64
            metadata: latest-linux-arm64.yml
            unpacked: linux-arm64-unpacked
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build isolated Linux packaging tool
        timeout-minutes: 8
        run: |
          command -v xvfb-run
          command -v cmake
          curl --fail --location --retry 2 --max-time 120 https://github.com/libarchive/libarchive/releases/download/v3.8.11/libarchive-3.8.11.tar.xz -o "$RUNNER_TEMP/libarchive.tar.xz"
          echo "a3dc0872b1b39da34dc18ef1b944f0f11ffd37425d70ae04be679279f1cf43d2  $RUNNER_TEMP/libarchive.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/libarchive.tar.xz" -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/libarchive-3.8.11" -B "$RUNNER_TEMP/libarchive-build" -DENABLE_TEST=OFF -DENABLE_INSTALL=OFF -DENABLE_OPENSSL=OFF
          cmake --build "$RUNNER_TEMP/libarchive-build" --target bsdtar --parallel 4
          "$RUNNER_TEMP/libarchive-build/bin/bsdtar" --version
          echo "$RUNNER_TEMP/libarchive-build/bin" >> "$GITHUB_PATH"

      - name: Build Linux packages
        run: npm run dist:linux:${{ matrix.arch }}

      - name: Test packaged desktop, CLI, and MCP
        run: |
          sudo chown root:root dist/${{ matrix.unpacked }}/chrome-sandbox
          sudo chmod 4755 dist/${{ matrix.unpacked }}/chrome-sandbox
          xvfb-run --auto-servernum node scripts/test-packaged-app-launch.js --app dist/${{ matrix.unpacked }}/signboard

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: signboard-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/signboard_*_linux_*.AppImage
            dist/signboard_*_linux_*.deb
            dist/signboard_*_linux_*.pacman
            dist/${{ matrix.metadata }}
